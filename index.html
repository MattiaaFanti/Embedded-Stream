<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>Hattrick Sport - Player Focus</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080b12;
  color: #eef3fb;
  font-family: system-ui, Arial, sans-serif;
}

body {
  padding: 12px;
}

.app {
  max-width: 1440px;
  margin: auto;
}

header {
  margin-bottom: 12px;
}

h1 {
  margin: 0;
  font-size: 21px;
}

.description {
  margin-top: 4px;
  color: #aab5c5;
  font-size: 13px;
}

.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

input {
  flex: 1;
  min-width: 220px;
  padding: 11px;
  color: white;
  background: #101725;
  border: 1px solid #35445b;
  border-radius: 8px;
}

button {
  padding: 11px 15px;
  border-radius: 8px;
  border: 1px solid #52617a;
  background: #e8edf5;
  color: #101622;
  font-weight: 700;
  cursor: pointer;
}

#focusButton {
  background: #245bc7;
  color: white;
  border-color: #5488e8;
}

.stage {
  position: relative;
  width: 100%;
  height: min(76vh, 850px);
  min-height: 260px;
  overflow: hidden;
  background: #000;
  border: 1px solid #293548;
  border-radius: 9px;
}

#siteFrame {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

#status {
  margin-top: 10px;
  min-height: 20px;
  color: #d5deec;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.note {
  margin-top: 8px;
  color: #9ca9bb;
  font-size: 12px;
  line-height: 1.5;
}

@media (max-width: 600px) {
  body {
    padding: 6px;
  }

  .stage {
    height: 70vh;
    min-height: 230px;
  }

  h1 {
    font-size: 18px;
  }
}
</style>
</head>

<body>
<div class="app">

  <header>
    <h1>Hattrick Sport</h1>
    <div class="description">
      Focus del player e scorciatoia fullscreen
    </div>
  </header>

  <form id="loadForm" class="controls">
    <input
      id="siteUrl"
      type="url"
      value="https://htsport.info/calcio.htm"
      aria-label="Indirizzo del sito streaming"
      required
    >
    <button type="submit">Carica sito</button>
    <button type="button" id="focusButton">
      DAI FOCUS AL PLAYER
    </button>
  </form>

  <main class="stage">
    <iframe
      id="siteFrame"
      title="Hattrick Sport"
      src="https://htsport.info/calcio.htm"
      tabindex="0"
      allow="fullscreen *; autoplay *; picture-in-picture *"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>

  <div id="status" role="status" aria-live="polite">
    Pagina caricata. Premi “Dai focus al player” e poi prova F.
  </div>

  <div class="note">
    Il pulsante tenta di trasferire il focus all'iframe Hattrick.
    Non forza il fullscreen del contenitore esterno.
  </div>

</div>

<script>
(() => {
  const frame = document.getElementById("siteFrame");
  const focusButton = document.getElementById("focusButton");
  const status = document.getElementById("status");
  const form = document.getElementById("loadForm");
  const urlInput = document.getElementById("siteUrl");

  function focusPlayer() {
    // Rende l'iframe raggiungibile tramite la tastiera.
    frame.setAttribute("tabindex", "0");

    // Prova a focalizzare il browsing context incorporato.
    try {
      frame.focus({ preventScroll: true });
    } catch (_) {
      frame.focus();
    }

    try {
      frame.contentWindow.focus();
    } catch (error) {
      console.warn("Focus del frame:", error);
    }

    // Controlla il focus dal documento esterno.
    setTimeout(() => {
      const focused = document.activeElement === frame;

      status.textContent = focused
        ? "Focus assegnato all'iframe Hattrick. Ora premi F sulla tastiera."
        : "Richiesta di focus inviata. Prova a premere F; se non funziona, clicca direttamente sul video.";

      console.log({
        iframeFocused: focused,
        activeElement: document.activeElement?.tagName,
        frameUrl: frame.src
      });
    }, 100);
  }

  focusButton.addEventListener("click", focusPlayer);

  // Clic diretto nell'area esterna dell'iframe: richiede il focus.
  frame.addEventListener("focus", () => {
    status.textContent =
      "L'iframe Hattrick ha ricevuto il focus. Prova F.";
  });

  frame.addEventListener("load", () => {
    status.textContent =
      "Hattrick Sport è stato caricato. Premi il pulsante Focus e prova F.";
  });

  form.addEventListener("submit", event => {
    event.preventDefault();

    try {
      const url = new URL(urlInput.value.trim());

      if (!["http:", "https:"].includes(url.protocol)) {
        throw new Error("Sono consentiti soltanto indirizzi HTTP o HTTPS.");
      }

      frame.src = url.href;
      status.textContent = "Caricamento di " + url.href;
    } catch (error) {
      status.textContent = "Indirizzo non valido: " + error.message;
    }
  });
})();
</script>

</body>
</html>
