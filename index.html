<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Hattrick Sport — Embedded Stream</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #siteFrame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: #000;
    }
  </style>
</head>

<body>
  <iframe
    id="siteFrame"
    src="https://htsport.info/calcio.htm"
    title="Hattrick Sport"
    allow="fullscreen *; autoplay *; picture-in-picture *; encrypted-media *"
    allowfullscreen
    webkitallowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</body>
</html>
