<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Hattrick Sport — Fullscreen Pass-through</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    #siteFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #000;
    }

    /* Barra strumenti, separata dal punto di clic. */
    #toolbar {
      position: fixed;
      z-index: 2147483647;
      top: 10px;
      right: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      max-width: calc(100vw - 20px);
      padding: 8px;
      border: 1px solid #596579;
      border-radius: 9px;
      background: rgba(12, 16, 24, .97);
      box-shadow: 0 3px 16px rgba(0,0,0,.5);
    }

    #toolbar button {
      padding: 9px 11px;
      border: 1px solid #707c90;
      border-radius: 6px;
      background: #202a3b;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    #toolbar button.primary {
      background: #2463d5;
      border-color: #75a0f5;
    }

    #status {
      position: fixed;
      z-index: 2147483646;
      bottom: 10px;
      left: 10px;
      max-width: calc(100vw - 20px);
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(0,0,0,.85);
      color: #fff;
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
    }

    /*
      Questo elemento si può trascinare solo in modalità
      calibrazione. In modalità pass-through non intercetta
      il clic: il browser colpisce il contenuto sottostante.
    */
    #target {
      position: fixed;
      z-index: 2147483646;
      left: calc(50vw - 30px);
      top: calc(50vh - 25px);
      width: 60px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed #fff;
      border-radius: 8px;
      color: #fff;
      background: rgba(10, 15, 24, .92);
      box-shadow: 0 2px 15px rgba(0,0,0,.65);
      font-size: 25px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #target.editing {
      cursor: move;
      pointer-events: auto;
      border-color: #ffd54a;
      background: rgba(70, 50, 0, .94);
    }

    #target.passthrough {
      cursor: default;
      pointer-events: none;
      border: 2px solid #49e68b;
      background: rgba(10, 80, 40, .28);
      box-shadow: none;
    }

    #targetLabel {
      position: fixed;
      z-index: 2147483645;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      max-width: calc(100vw - 24px);
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(0,0,0,.8);
      color: white;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      #toolbar {
        top: 6px;
        right: 6px;
        left: 6px;
        justify-content: center;
      }

      #toolbar button {
        padding: 9px 8px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main id="stage">
    <iframe
      id="siteFrame"
      src="https://htsport.info/calcio.htm"
      title="Hattrick Sport"
      allow="fullscreen *; autoplay *; picture-in-picture *; encrypted-media *"
      allowfullscreen>
    </iframe>
  </main>

  <div id="toolbar">
    <button id="modeButton" class="primary">
      1. BLOCCA POSIZIONE
    </button>
    <button id="resetButton">
      RIPOSIZIONA
    </button>
  </div>

  <div id="target" class="editing" aria-label="Punto fullscreen">
    ⛶
  </div>

  <div id="targetLabel">
    CALIBRAZIONE: trascina ⛶ sopra il vero pulsante fullscreen del video
  </div>

  <div id="status">
    Il bersaglio intercetta i tocchi durante la calibrazione.
  </div>

  <script>
    (() => {
      "use strict";

      const target = document.getElementById("target");
      const modeButton = document.getElementById("modeButton");
      const resetButton = document.getElementById("resetButton");
      const status = document.getElementById("status");
      const label = document.getElementById("targetLabel");

      const STORAGE_KEY = "hattrick-fullscreen-target-v1";

      let editing = true;
      let dragging = false;
      let pointerOffsetX = 0;
      let pointerOffsetY = 0;

      function savePosition() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            left: target.offsetLeft,
            top: target.offsetTop
          }));
        } catch (_) {}
      }

      function restorePosition() {
        try {
          const saved = JSON.parse(
            localStorage.getItem(STORAGE_KEY) || "null"
          );

          if (!saved) return;

          if (Number.isFinite(saved.left) &&
              Number.isFinite(saved.top)) {
            setPosition(saved.left, saved.top);
          }
        } catch (_) {}
      }

      function setPosition(left, top) {
        const maxLeft = Math.max(0, window.innerWidth - target.offsetWidth);
        const maxTop = Math.max(0, window.innerHeight - target.offsetHeight);

        target.style.left =
          Math.max(0, Math.min(left, maxLeft)) + "px";

        target.style.top =
          Math.max(0, Math.min(top, maxTop)) + "px";
      }

      function setMode(passThrough) {
        editing = !passThrough;

        target.classList.toggle("editing", editing);
        target.classList.toggle("passthrough", passThrough);

        modeButton.textContent = editing
          ? "1. BLOCCA POSIZIONE"
          : "MODIFICA POSIZIONE";

        label.textContent = editing
          ? "CALIBRAZIONE: trascina ⛶ sopra il vero pulsante fullscreen"
          : "CLICK-THROUGH ATTIVO: clicca sul simbolo ⛶ per raggiungere il player sottostante";

        status.textContent = editing
          ? "Modalità calibrazione: puoi trascinare il bersaglio."
          : "Il bersaglio non intercetta più i clic. Prova a cliccare sopra ⛶.";

        savePosition();
      }

      target.addEventListener("pointerdown", event => {
        if (!editing) return;

        dragging = true;

        const rect = target.getBoundingClientRect();

        pointerOffsetX = event.clientX - rect.left;
        pointerOffsetY = event.clientY - rect.top;

        target.setPointerCapture(event.pointerId);
        event.preventDefault();
      });

      target.addEventListener("pointermove", event => {
        if (!editing || !dragging) return;

        setPosition(
          event.clientX - pointerOffsetX,
          event.clientY - pointerOffsetY
        );
      });

      function endDrag() {
        if (!dragging) return;

        dragging = false;
        savePosition();
      }

      target.addEventListener("pointerup", endDrag);
      target.addEventListener("pointercancel", endDrag);
      target.addEventListener("lostpointercapture", endDrag);

      modeButton.addEventListener("click", () => {
        setMode(editing);
      });

      resetButton.addEventListener("click", () => {
        setPosition(
          window.innerWidth / 2 - target.offsetWidth / 2,
          window.innerHeight / 2 - target.offsetHeight / 2
        );
        savePosition();
        setMode(false);
      });

      window.addEventListener("resize", () => {
        setPosition(target.offsetLeft, target.offsetTop);
        savePosition();
      });

      restorePosition();
      setMode(false);
    })();
  </script>
</body>
</html>
