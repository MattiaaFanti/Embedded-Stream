<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#000000">
    <title>Embedded Stream</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            text-align: center;
        }

        main {
            max-width: 420px;
        }

        a {
            display: inline-block;
            margin-top: 16px;
            padding: 14px 22px;
            color: #fff;
            background: #1769ff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main>
        <p>Connessione al player Hattrick…</p>

        <a href="https://htsport.info/calcio.htm" id="openPlayer">
            APRI HATTRICK
        </a>
    </main>

    <script>
        (() => {
            const target = "https://htsport.info/calcio.htm";

            // Apre Hattrick come pagina principale,
            // senza incorporarlo in un ulteriore iframe.
            window.location.replace(target);
        })();
    </script>
</body>
</html>
