<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>Hattrick Sport — Focus Player</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080b12;
  color: #eef3fb;
  font-family: system-ui, Arial, sans-serif;
}

body {
  padding: 12px;
}

.app {
  max-width: 1440px;
  margin: 0 auto;
}

header {
  margin-bottom: 12px;
}

h1 {
  margin: 0;
  font-size: 21px;
}

.description {
  color: #aab5c5;
  font-size: 13px;
  margin-top: 4px;
}

.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

input {
  flex: 1;
  min-width: 220px;
  padding: 11px;
  color: white;
  background: #101725;
  border: 1px solid #35445b;
  border-radius: 8px;
}

button {
  padding: 11px 15px;
  border-radius: 8px;
  border: 1px solid #52617a;
  background: #e8edf5;
  color: #101622;
  font-weight: 700;
  cursor: pointer;
}

#focusButton {
  background: #245bc7;
  color: white;
  border-color: #5488e8;
}

#siteFrame {
  display: block;
  width: 100%;
  height: min(76vh, 850px);
  min-height: 260px;
  border: 1px solid #293548;
  border-radius: 9px;
  background: #000;
}

#status {
  margin-top: 10px;
  min-height: 20px;
  color: #d5deec;
  font-size: 13px;
  overflow-wrap: anywhere;
}

#log {
  background: #101725;
  border: 1px solid #293548;
  border-radius: 8px;
  padding: 10px;
  margin-top: 10px;
  max-height: 180px;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: 12px/1.5 monospace;
}

@media (max-width: 600px) {
  body {
    padding: 6px;
  }

  #siteFrame {
    height: 70vh;
    min-height: 230px;
  }

  h1 {
    font-size: 18px;
  }
}
</style>
</head>

<body>
<div class="app">

  <header>
    <h1>Hattrick Sport</h1>
    <div class="description">
      Test focus e navigazione da tastiera verso il player
    </div>
  </header>

  <form id="loadForm" class="controls">
    <input
      id="siteUrl"
      type="url"
      value="https://htsport.info/calcio.htm"
      aria-label="Indirizzo del sito streaming"
      required
    >
    <button type="submit">Carica sito</button>
    <button type="button" id="focusButton">
      FOCUS + 3 TAB
    </button>
  </form>

  <iframe
    id="siteFrame"
    title="Hattrick Sport"
    src="https://htsport.info/calcio.htm"
    tabindex="0"
    allow="fullscreen *; autoplay *; picture-in-picture *"
    allowfullscreen
    webkitallowfullscreen>
  </iframe>

  <div id="status" role="status" aria-live="polite">
    Carica il sito e premi FOCUS + 3 TAB.
  </div>

  <pre id="log">Il registro delle prove apparirà qui.</pre>

</div>

<script>
(() => {
  "use strict";

  const frame = document.getElementById("siteFrame");
  const focusButton = document.getElementById("focusButton");
  const status = document.getElementById("status");
  const log = document.getElementById("log");
  const form = document.getElementById("loadForm");
  const urlInput = document.getElementById("siteUrl");

  const sleep = ms =>
    new Promise(resolve => setTimeout(resolve, ms));

  function writeLog(message, data) {
    const detail = data ? " " + JSON.stringify(data) : "";
    log.textContent += "\n" + message + detail;
    log.scrollTop = log.scrollHeight;
    console.log(message, data || "");
  }

  function getFocusInfo() {
    const active = document.activeElement;

    return {
      pagina: location.href,
      elementoAttivo: active?.tagName || null,
      id: active?.id || null,
      eIframeHattrick: active === frame,
      attivazioneUtente:
        navigator.userActivation?.isActive ?? null
    };
  }

  function dispatchTab(target, phase) {
    if (!target || typeof target.dispatchEvent !== "function") {
      return false;
    }

    const event = new KeyboardEvent(phase, {
      key: "Tab",
      code: "Tab",
      keyCode: 9,
      which: 9,
      bubbles: true,
      cancelable: true,
      composed: true
    });

    return target.dispatchEvent(event);
  }

  async function focusAndThreeTabs() {
    log.textContent = "";
    status.textContent = "Assegnazione del focus in corso...";

    frame.setAttribute("tabindex", "0");

    try {
      frame.focus({ preventScroll: true });
    } catch (_) {
      frame.focus();
    }

    try {
      frame.contentWindow.focus();
    } catch (error) {
      writeLog("Focus del frame:", {
        errore: error.message
      });
    }

    await sleep(150);

    writeLog("FOCUS INIZIALE:", getFocusInfo());

    for (let i = 1; i <= 3; i++) {
      const target = document.activeElement || frame;

      const down = dispatchTab(target, "keydown");

      await sleep(50);

      const up = dispatchTab(target, "keyup");

      await sleep(250);

      writeLog("TAB " + i + ":", {
        keydownInviato: down,
        keyupInviato: up,
        ...getFocusInfo()
      });
    }

    status.textContent =
      "Test completato. Controlla il registro per verificare se il focus è cambiato.";

    writeLog("RISULTATO FINALE:", getFocusInfo());
  }

  focusButton.addEventListener("click", focusAndThreeTabs);

  form.addEventListener("submit", event => {
    event.preventDefault();

    try {
      const url = new URL(urlInput.value.trim());

      if (!["http:", "https:"].includes(url.protocol)) {
        throw new Error("Sono consentiti soltanto URL HTTP e HTTPS.");
      }

      frame.src = url.href;
      status.textContent = "Caricamento di " + url.href;
      log.textContent = "Pagina in caricamento...";
    } catch (error) {
      status.textContent = "URL non valido: " + error.message;
    }
  });

  frame.addEventListener("load", () => {
    status.textContent =
      "Sito caricato. Premi FOCUS + 3 TAB per eseguire il test.";
  });
})();
</script>
</body>
</html>
