<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Embedded Stream</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    #siteFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #playOverlay {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 999999;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 15px 10px 10px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 40px;
      background: rgba(12, 15, 22, .94);
      color: white;
      box-shadow: 0 4px 18px rgba(0,0,0,.65);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #playIcon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      padding-left: 4px;
      border-radius: 50%;
      background: #e53935;
      color: #fff;
      font-size: 23px;
    }

    #playText {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    #playOverlay:active {
      transform: scale(.98);
    }

    #status {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 999998;
      max-width: calc(100% - 24px);
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(0,0,0,.75);
      color: #fff;
      font-size: 12px;
      pointer-events: none;
    }

    #status.hidden {
      display: none;
    }

    @media (max-width: 600px) {
      #playOverlay {
        top: 12px;
        left: 12px;
      }

      #playIcon {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
      }

      #playText {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main id="stage">

    <!-- Hattrick viene caricato immediatamente, dietro al pulsante. -->
    <!-- Il sandbox non concede popup o nuove schede. -->
    <iframe
      id="siteFrame"
      src="https://htsport.info/calcio.htm"
      title="Hattrick Sport"
      tabindex="0"
      sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
      allow="fullscreen *; autoplay *; picture-in-picture *; encrypted-media *"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <!-- Pulsante di primo accesso, sovrapposto in alto a sinistra. -->
    <button id="playOverlay" type="button">
      <span id="playIcon" aria-hidden="true">▶</span>
      <span id="playText">AVVIA PLAYER</span>
    </button>

    <div id="status">Caricamento del player in corso…</div>
  </main>

  <script>
    (() => {
      "use strict";

      const frame = document.getElementById("siteFrame");
      const overlay = document.getElementById("playOverlay");
      const status = document.getElementById("status");

      let loaded = false;

      frame.addEventListener("load", () => {
        loaded = true;
        status.textContent = "Player caricato. Premi AVVIA PLAYER.";
      });

      overlay.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();

        // Nasconde il nostro pulsante: il clic non viene
        // inoltrato al documento incorporato.
        overlay.remove();

        // Richiede il focus dell'iframe Hattrick.
        try {
          frame.focus({ preventScroll: true });
        } catch (_) {
          frame.focus();
        }

        try {
          frame.contentWindow.focus();
        } catch (_) {}

        status.textContent = loaded
          ? "Player pronto. Ora interagisci direttamente con il video."
          : "Focus richiesto. Il player sta ancora caricando.";

        console.log("Overlay rimosso; focus richiesto all'iframe.");
      });
    })();
  </script>
</body>
</html>
