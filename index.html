<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Hattrick Sport in un'interfaccia adattiva.">

  <title>Hattrick Stream</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hattrick Stream">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --panel: rgba(15, 19, 28, .94);
      --border: rgba(255, 255, 255, .22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, Arial, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    /*
      La pagina Hattrick viene visualizzata dentro un viewport
      di riferimento 1280x720. JavaScript ridimensiona l'intero
      viewport per adattarlo alla finestra senza deformarlo.
    */
    #siteFrame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1280px;
      height: 720px;
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      background: #000;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
    }

    #controls {
      position: absolute;
      z-index: 1000;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      max-width: calc(100% - 20px);
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 4px 18px rgba(0, 0, 0, .4);
    }

    .control {
      min-height: 42px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 8px;
      background: #253044;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
    }

    .control:active {
      background: #3a4d6a;
    }

    #installButton[hidden] {
      display: none;
    }

    #status {
      position: absolute;
      z-index: 1000;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 20px);
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: #eee;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
    }

    #app:fullscreen,
    #app:-webkit-full-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
    }

    #app.css-fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
    }

    #app:fullscreen #controls,
    #app:-webkit-full-screen #controls,
    #app.css-fullscreen #controls {
      top: max(8px, env(safe-area-inset-top));
    }

    @media (max-width: 480px) {
      #controls {
        gap: 5px;
        padding: 5px;
      }

      .control {
        min-height: 40px;
        padding: 9px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main id="app">

    <iframe
      id="siteFrame"
      title="Hattrick Sport"
      src="https://htsport.info/calcio.htm"

      sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"

      allow="fullscreen *; autoplay *; encrypted-media *; picture-in-picture *"
      allowfullscreen

      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <nav id="controls" aria-label="Controlli">
      <button id="fullscreenButton" class="control" type="button">
        ⛶ Schermo intero
      </button>

      <button id="installButton" class="control" type="button" hidden>
        Installa
      </button>
    </nav>

    <div id="status" role="status" aria-live="polite">
      Adattamento del player in corso…
    </div>

  </main>

  <script>
    (() => {
      "use strict";

      const app = document.getElementById("app");
      const frame = document.getElementById("siteFrame");
      const fullscreenButton = document.getElementById("fullscreenButton");
      const installButton = document.getElementById("installButton");
      const status = document.getElementById("status");

      const BASE_WIDTH = 1280;
      const BASE_HEIGHT = 720;

      let installPrompt = null;
      let cssFullscreen = false;
      let resizeTimer = null;

      function calculateScale() {
        const rect = app.getBoundingClientRect();

        const availableWidth = Math.max(1, rect.width);
        const availableHeight = Math.max(1, rect.height);

        const scale = Math.min(
          availableWidth / BASE_WIDTH,
          availableHeight / BASE_HEIGHT
        );

        frame.style.transform =
          `translate(-50%, -50%) scale(${scale})`;

        return {
          scale,
          width: Math.round(BASE_WIDTH * scale),
          height: Math.round(BASE_HEIGHT * scale)
        };
      }

      function scheduleResize() {
        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {
          const result = calculateScale();

          status.textContent =
            `Viewport adattato: ${result.width} × ${result.height}`;
        }, 120);
      }

      function isFullscreen() {
        return document.fullscreenElement === app ||
          document.webkitFullscreenElement === app ||
          cssFullscreen;
      }

      function updateFullscreenButton() {
        fullscreenButton.textContent = isFullscreen()
          ? "✕ Esci"
          : "⛶ Schermo intero";
      }

      async function enterFullscreen() {
        try {
          if (app.requestFullscreen) {
            await app.requestFullscreen({
              navigationUI: "hide"
            });
          } else if (app.webkitRequestFullscreen) {
            app.webkitRequestFullscreen();
          } else {
            /*
              Fallback visivo per browser che non consentono
              il fullscreen nativo di elementi HTML.
            */
            cssFullscreen = true;
            app.classList.add("css-fullscreen");
          }

          // Tentativo di orientamento landscape sui dispositivi
          // che supportano il blocco dell'orientamento.
          if (
            screen.orientation &&
            typeof screen.orientation.lock === "function"
          ) {
            try {
              await screen.orientation.lock("landscape");
            } catch (_) {
              // iOS e alcuni browser non consentono questo lock.
            }
          }
        } catch (error) {
          cssFullscreen = true;
          app.classList.add("css-fullscreen");

          status.textContent =
            "Modalità a schermo intero compatibile attivata.";
        }

        calculateScale();
        updateFullscreenButton();
      }

      async function exitFullscreen() {
        try {
          if (
            document.fullscreenElement === app &&
            document.exitFullscreen
          ) {
            await document.exitFullscreen();
          } else if (
            document.webkitFullscreenElement === app &&
            document.webkitExitFullscreen
          ) {
            document.webkitExitFullscreen();
          }
        } catch (error) {
          console.warn("Uscita dal fullscreen:", error);
        }

        if (
          screen.orientation &&
          typeof screen.orientation.unlock === "function"
        ) {
          try {
            screen.orientation.unlock();
          } catch (_) {}
        }

        cssFullscreen = false;
        app.classList.remove("css-fullscreen");

        calculateScale();
        updateFullscreenButton();
      }

      fullscreenButton.addEventListener("click", async () => {
        if (isFullscreen()) {
          await exitFullscreen();
        } else {
          await enterFullscreen();
        }
      });

      document.addEventListener("fullscreenchange", () => {
        calculateScale();
        updateFullscreenButton();
      });

      document.addEventListener("webkitfullscreenchange", () => {
        calculateScale();
        updateFullscreenButton();
      });

      window.addEventListener("resize", scheduleResize);

      window.addEventListener("orientationchange", () => {
        setTimeout(calculateScale, 250);
        setTimeout(calculateScale, 700);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scheduleResize);
      }

      frame.addEventListener("load", () => {
        calculateScale();

        status.textContent =
          "Hattrick caricato. Ruota il dispositivo per una visualizzazione più ampia.";
      });

      window.addEventListener("beforeinstallprompt", event => {
        event.preventDefault();
        installPrompt = event;
        installButton.hidden = false;
      });

      window.addEventListener("appinstalled", () => {
        installPrompt = null;
        installButton.hidden = true;
        status.textContent = "Hattrick Stream installato.";
      });

      installButton.addEventListener("click", async () => {
        if (installPrompt) {
          installPrompt.prompt();
          await installPrompt.userChoice;
          installPrompt = null;
          installButton.hidden = true;
          return;
        }

        const isApple = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        status.textContent = isApple
          ? "In Safari: Condividi → Aggiungi alla schermata Home."
          : "Apri il menu del browser e scegli Installa app o Aggiungi alla schermata Home.";
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            await navigator.serviceWorker.register("./sw.js", {
              scope: "./"
            });
          } catch (error) {
            console.warn("Service worker:", error);
          }
        });
      }

      calculateScale();
    })();
  </script>
</body>
</html>
