<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <title>Hattrick Sport — Embedded Stream</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #siteFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #playOverlay {
      position: absolute;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.30);
      cursor: pointer;
    }

    #playButton {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      padding: 0 0 0 6px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: rgba(15, 15, 15, 0.90);
      color: #fff;
      font-size: 35px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .65);
      transition: transform .15s ease, background .15s ease;
    }

    #playButton:hover {
      background: #222;
      transform: scale(1.07);
    }

    #playOverlay.hidden {
      display: none;
    }

    #status {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 1000000;
      padding: 6px 9px;
      border-radius: 5px;
      background: rgba(0, 0, 0, .7);
      color: #ddd;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main id="stage">

    <iframe
      id="siteFrame"
      src="https://htsport.info/calcio.htm"
      title="Hattrick Sport"
      tabindex="0"
      sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
      allow="fullscreen *; autoplay *; picture-in-picture *; encrypted-media *"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <div id="playOverlay">
      <button
        id="playButton"
        type="button"
        aria-label="Avvia player">
        ▶
      </button>
    </div>

    <div id="status">
      Premi Play per attivare il player
    </div>

  </main>

  <script>
    (() => {
      "use strict";

      const frame = document.getElementById("siteFrame");
      const overlay = document.getElementById("playOverlay");
      const button = document.getElementById("playButton");
      const status = document.getElementById("status");

      function activatePlayer(event) {
        event.preventDefault();
        event.stopPropagation();

        // Il clic resta sulla nostra pagina:
        // non viene inoltrato al sito incorporato.
        overlay.classList.add("hidden");

        // Tentativo di assegnare il focus all'iframe.
        frame.setAttribute("tabindex", "0");

        try {
          frame.focus({ preventScroll: true });
        } catch (_) {
          frame.focus();
        }

        try {
          frame.contentWindow.focus();
        } catch (_) {}

        status.textContent =
          "Player attivato. Le finestre pubblicitarie sono bloccate.";

        console.log("Play overlay rimosso; focus richiesto a Hattrick.");
      }

      button.addEventListener("click", activatePlayer);
      overlay.addEventListener("click", activatePlayer);
    })();
  </script>
</body>
</html>
