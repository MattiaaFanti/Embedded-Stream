<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Hattrick Sport — Player Focus</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    #siteFrame {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #playButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2147483647;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 190px;
      min-height: 76px;
      padding: 16px 24px;
      border: 2px solid #fff;
      border-radius: 14px;
      background: rgba(15, 20, 30, .97);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 24px rgba(0, 0, 0, .65);
      touch-action: manipulation;
    }

    #playButton.visible {
      display: flex;
    }

    #playIcon {
      font-size: 30px;
      line-height: 1;
    }

    #status {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 2147483646;
      width: fit-content;
      max-width: calc(100% - 24px);
      margin: 0 auto;
      padding: 8px 12px;
      border-radius: 7px;
      background: rgba(0, 0, 0, .84);
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main id="stage">
    <iframe
      id="siteFrame"
      src="https://htsport.info/calcio.htm"
      title="Hattrick Sport"
      tabindex="0"
      sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
      allow="fullscreen *; autoplay *; picture-in-picture *; encrypted-media *"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <button id="playButton" type="button">
      <span id="playIcon" aria-hidden="true">▶</span>
      <span id="playText">AVVIA PLAYER</span>
    </button>

    <div id="status" role="status" aria-live="polite">
      Caricamento e ricerca dei frame…
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const frame = document.getElementById("siteFrame");
      const button = document.getElementById("playButton");
      const playText = document.getElementById("playText");
      const status = document.getElementById("status");

      const sleep = ms =>
        new Promise(resolve => setTimeout(resolve, ms));

      let contexts = [];
      let searching = false;
      let activated = false;

      function collectFrames() {
        const result = [];
        const visited = new Set();

        function visit(win, path) {
          if (!win || visited.has(win)) return;
          visited.add(win);

          let count = 0;

          try {
            count = win.length;
          } catch (error) {
            result.push({
              win,
              path,
              children: null,
              readable: false
            });
            return;
          }

          result.push({
            win,
            path,
            children: count,
            readable: true
          });

          for (let i = 0; i < count; i++) {
            try {
              visit(win.frames[i], path.concat(i));
            } catch (error) {
              console.warn(
                "Frame non raggiungibile:",
                path.concat(i),
                error
              );
            }
          }
        }

        try {
          visit(frame.contentWindow, ["siteFrame"]);
        } catch (error) {
          console.warn("Frame Hattrick non accessibile:", error);
        }

        return result;
      }

      function requestFocus(win) {
        try {
          win.focus();
          return true;
        } catch (_) {
          return false;
        }
      }

      function sendSyntheticF(context) {
        const win = context.win;

        try {
          const doc = win.document;

          const target =
            doc.activeElement &&
            doc.activeElement !== doc.body
              ? doc.activeElement
              : doc;

          const options = {
            key: "f",
            code: "KeyF",
            keyCode: 70,
            which: 70,
            bubbles: true,
            cancelable: true,
            composed: true
          };

          target.dispatchEvent(
            new win.KeyboardEvent("keydown", options)
          );

          setTimeout(() => {
            try {
              target.dispatchEvent(
                new win.KeyboardEvent("keyup", options)
              );
            } catch (_) {}
          }, 50);

          return {
            path: context.path.join(" → "),
            result: "Evento sintetico inviato"
          };
        } catch (error) {
          return {
            path: context.path.join(" → "),
            result: "Bloccato dal browser: " + error.name
          };
        }
      }

      async function searchPlayer() {
        if (searching) return;
        searching = true;

        status.textContent = "Ricerca dei frame in corso…";

        try {
          frame.focus({ preventScroll: true });
        } catch (_) {
          frame.focus();
        }

        requestFocus(frame.contentWindow);

        await sleep(500);
        contexts = collectFrames();

        if (contexts.length <= 1) {
          await sleep(900);
          contexts = collectFrames();
        }

        contexts.sort((a, b) => a.path.length - b.path.length);

        console.table(
          contexts.map(context => ({
            percorso: context.path.join(" → "),
            profondità: context.path.length,
            sottoframe: context.children,
            DOMAccessibile: context.readable
          }))
        );

        button.classList.add("visible");
        status.textContent =
          "Ricerca completata: " + contexts.length +
          " contesti trovati. Premi AVVIA PLAYER.";

        searching = false;
      }

      function playClick() {
        if (activated) return;
        activated = true;

        button.disabled = true;
        playText.textContent = "ATTIVAZIONE…";
        status.textContent = "Richiesta del focus e tentativo F…";

        // Prova a focalizzare tutti i contesti trovati in precedenza.
        for (const context of contexts) {
          requestFocus(context.win);
        }

        // I contesti più profondi vengono tentati per primi.
        const deepestFirst = [...contexts].sort(
          (a, b) => b.path.length - a.path.length
        );

        const results = deepestFirst.map(sendSyntheticF);
        console.table(results);

        button.classList.remove("visible");

        status.textContent =
          "Tentativo completato. Gli eventi sintetici F possono essere rifiutati dal browser.";

        console.log({
          contextsFound: contexts.length,
          results,
          userActivation: navigator.userActivation?.isActive
        });
      }

      button.addEventListener("click", playClick);

      frame.addEventListener("load", () => {
        status.textContent = "Hattrick caricato. Ricerca dei frame…";
        searchPlayer();
      });

      // Gestisce anche il caso in cui il frame abbia già terminato
      // il caricamento prima dell'installazione del listener.
      window.addEventListener("load", () => {
        if (!contexts.length) searchPlayer();
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js", { scope: "./" })
            .catch(error => console.warn("Service worker:", error));
        });
      }
    })();
  </script>
</body>
</html>
