
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>HTSport</title>

  <meta
    name="theme-color"
    content="#000000"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #htsport-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
  </style>
</head>

<body>

  <iframe
    id="htsport-frame"
    src="https://htsport.info/"
    title="HTSport"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen
    webkitallowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

</body>
</html>
