<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Hattrick Sport — Fullscreen Pass-through</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    #siteFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #000;
    }

    #target {
      position: fixed;
      z-index: 2147483646;
      width: 60px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #49e68b;
      border-radius: 8px;
      color: #fff;
      background: rgba(10, 80, 40, .28);
      font-size: 25px;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: none;
    }

    #status {
      position: fixed;
      z-index: 2147483645;
      left: 10px;
      bottom: 10px;
      max-width: calc(100vw - 20px);
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .8);
      color: #fff;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main id="stage">
    <iframe
      id="siteFrame"
      src="https://htsport.info/calcio.htm"
      title="Hattrick Sport"
      allow="fullscreen *; autoplay *; picture-in-picture *; encrypted-media *"
      allowfullscreen>
    </iframe>
  </main>

  <div id="target" aria-hidden="true">⛶</div>

  <div id="status">
    Posizionamento automatico del bersaglio…
  </div>

  <script>
    (() => {
      "use strict";

      const target = document.getElementById("target");
      const status = document.getElementById("status");

      // Dimensioni ricavate dalla calibrazione sul PC.
      const PLAYER_MAX_WIDTH = 834;
      const PLAYER_ASPECT_RATIO = 16 / 9;

      // Offset verticale calibrato rispetto al bordo del video.
      const TARGET_Y_OFFSET = 18;

      function positionTarget() {
        const viewportWidth = document.documentElement.clientWidth;
        const viewportHeight = document.documentElement.clientHeight;

        const targetWidth = target.offsetWidth;
        const targetHeight = target.offsetHeight;

        // Adatta la larghezza alla finestra, mantenendo il limite
        // massimo dedotto dalla calibrazione originale.
        const widthAllowedByHeight =
          Math.max(0, viewportHeight - targetHeight + TARGET_Y_OFFSET)
          * PLAYER_ASPECT_RATIO;

        const playerWidth = Math.min(
          viewportWidth,
          PLAYER_MAX_WIDTH,
          widthAllowedByHeight
        );

        const playerHeight = playerWidth / PLAYER_ASPECT_RATIO;

        // Il bersaglio resta vicino all'angolo inferiore destro
        // dell'area video stimata.
        const left = playerWidth - targetWidth;
        const top = playerHeight - TARGET_Y_OFFSET;

        target.style.left =
          Math.max(0, Math.min(left, viewportWidth - targetWidth)) + "px";

        target.style.top =
          Math.max(0, Math.min(top, viewportHeight - targetHeight)) + "px";

        status.textContent =
          "Bersaglio adattivo: " +
          Math.round(playerWidth) + " × " +
          Math.round(playerHeight) + " px";
      }

      let resizeTimer;

      function schedulePosition() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(positionTarget, 150);
      }

      window.addEventListener("resize", schedulePosition);
      window.addEventListener("orientationchange", schedulePosition);

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", schedulePosition);
      }

      positionTarget();

      console.log("Posizionamento adattivo attivo.");
    })();
  </script>
</body>
</html>
