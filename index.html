<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Hattrick Sport — Fullscreen</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #siteFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #calibrate {
      position: fixed;
      z-index: 100;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 20px;
      border: 1px solid #fff;
      border-radius: 10px;
      background: #245bc7;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      white-space: nowrap;
    }

    #target {
      position: fixed;
      z-index: 90;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      border: 2px solid #49e68b;
      border-radius: 8px;
      background: rgba(10, 80, 40, .24);
      color: white;
      font-size: 26px;

      /* Il tocco attraversa il simbolo e raggiunge il player. */
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #calibrationLayer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, .08);
      touch-action: manipulation;
    }

    #calibrationLayer.active {
      display: block;
    }

    #instructions {
      display: none;
      position: fixed;
      z-index: 110;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 400px;
      padding: 15px;
      border: 1px solid #ffd54a;
      border-radius: 10px;
      background: rgba(15, 18, 25, .97);
      color: white;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
    }

    #instructions.visible {
      display: block;
    }

    #status {
      position: fixed;
      z-index: 70;
      bottom: 8px;
      left: 8px;
      padding: 6px 9px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .78);
      color: white;
      font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <iframe
    id="siteFrame"
    src="https://htsport.info/calcio.htm"
    title="Hattrick Sport"
    allow="fullscreen *; autoplay *; picture-in-picture *; encrypted-media *"
    allowfullscreen>
  </iframe>

  <button id="calibrate" type="button">
    POSIZIONA FULLSCREEN
  </button>

  <div id="target" aria-hidden="true" style="display:none">⛶</div>

  <div id="calibrationLayer"></div>

  <div id="instructions">
    Tocca il centro del vero pulsante fullscreen del video.
    La posizione verrà salvata automaticamente.
  </div>

  <div id="status">Caricamento del player…</div>

  <script>
    (() => {
      "use strict";

      const KEY = "hattrick-fullscreen-position-v1";

      const target = document.getElementById("target");
      const calibrate = document.getElementById("calibrate");
      const layer = document.getElementById("calibrationLayer");
      const instructions = document.getElementById("instructions");
      const status = document.getElementById("status");

      let savedPosition = null;
      let calibrationMode = false;

      function positionTarget() {
        if (!savedPosition) return;

        target.style.left = (savedPosition.x * 100) + "vw";
        target.style.top = (savedPosition.y * 100) + "vh";
        target.style.display = "flex";
      }

      function loadPosition() {
        try {
          const stored = localStorage.getItem(KEY);

          if (stored) {
            const p = JSON.parse(stored);

            if (
              Number.isFinite(p.x) &&
              Number.isFinite(p.y) &&
              p.x >= 0 && p.x <= 1 &&
              p.y >= 0 && p.y <= 1
            ) {
              savedPosition = p;
            }
          }
        } catch (e) {
          console.warn("Lettura posizione:", e);
        }

        if (savedPosition) {
          positionTarget();
          calibrate.textContent = "RICALIBRA POSIZIONE";
          status.textContent =
            "Posizione caricata. Tocca il simbolo verde.";
        } else {
          status.textContent =
            "Prima apertura: posiziona il pulsante fullscreen.";
        }
      }

      function startCalibration() {
        calibrationMode = true;
        layer.classList.add("active");
        instructions.classList.add("visible");

        calibrate.textContent = "ANNULLA";
        status.textContent =
          "Calibrazione: tocca il pulsante fullscreen reale del video.";
      }

      function cancelCalibration() {
        calibrationMode = false;
        layer.classList.remove("active");
        instructions.classList.remove("visible");

        calibrate.textContent = savedPosition
          ? "RICALIBRA POSIZIONE"
          : "POSIZIONA FULLSCREEN";

        status.textContent = savedPosition
          ? "Posizione precedente mantenuta."
          : "Calibrazione annullata.";

        positionTarget();
      }

      function finishCalibration(event) {
        if (!calibrationMode) return;

        event.preventDefault();
        event.stopPropagation();

        savedPosition = {
          x: Math.max(0, Math.min(1, event.clientX / window.innerWidth)),
          y: Math.max(0, Math.min(1, event.clientY / window.innerHeight))
        };

        try {
          localStorage.setItem(KEY, JSON.stringify(savedPosition));
        } catch (e) {
          console.warn("Salvataggio posizione:", e);
        }

        calibrationMode = false;
        layer.classList.remove("active");
        instructions.classList.remove("visible");

        positionTarget();

        calibrate.textContent = "RICALIBRA POSIZIONE";
        status.textContent =
          "Salvato su questo dispositivo. Tocca il simbolo verde per il fullscreen.";
      }

      calibrate.addEventListener("click", () => {
        if (calibrationMode) {
          cancelCalibration();
        } else {
          startCalibration();
        }
      });

      layer.addEventListener("pointerdown", finishCalibration);

      window.addEventListener("resize", positionTarget);
      window.addEventListener("orientationchange", () => {
        setTimeout(positionTarget, 200);
      });

      document.getElementById("siteFrame").addEventListener("load", () => {
        status.textContent = savedPosition
          ? "Player caricato. Posizione salvata disponibile."
          : "Player caricato. Tocca POSIZIONA FULLSCREEN.";
      });

      loadPosition();
    })();
  </script>
</body>
</html>
