<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>Embedded Stream</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #playerFrame {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            border: 0;
            background: #000;
        }
    </style>
</head>

<body>
    <iframe
        id="playerFrame"
        src="https://daddyliveplayer.st/premiumtv/gomstream.php?id=870"
        title="Video player"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
        allowfullscreen
        webkitallowfullscreen
        scrolling="no"
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>
</body>
</html>
