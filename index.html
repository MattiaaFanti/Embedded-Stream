<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Hattrick Sport — Player Focus</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    #siteFrame {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #focusButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2147483647;
      padding: 16px 24px;
      border: 2px solid #fff;
      border-radius: 10px;
      background: rgba(15, 20, 30, .96);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 24px rgba(0, 0, 0, .65);
    }

    #focusButton:active {
      background: #245bc7;
      transform: translate(-50%, -50%) scale(.97);
    }

    #focusButton:disabled {
      opacity: .7;
      cursor: wait;
    }

    #status {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 2147483646;
      max-width: calc(100% - 24px);
      padding: 8px 11px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .8);
      color: #fff;
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main id="stage">

    <iframe
      id="siteFrame"
      src="https://htsport.info/calcio.htm"
      title="Hattrick Sport"
      tabindex="0"
      allow="fullscreen *; autoplay *; picture-in-picture *; encrypted-media *"
      allowfullscreen>
    </iframe>

    <button id="focusButton" type="button">
      FOCUS PLAYER
    </button>

    <div id="status" role="status" aria-live="polite">
      Hattrick Sport in caricamento.
    </div>

  </main>

  <script>
    (() => {
      "use strict";

      const frame = document.getElementById("siteFrame");
      const button = document.getElementById("focusButton");
      const status = document.getElementById("status");

      const sleep = ms =>
        new Promise(resolve => setTimeout(resolve, ms));

      function requestWindowFocus(win) {
        try {
          win.focus();
          return true;
        } catch (error) {
          return false;
        }
      }

      function collectFrames() {
        const collected = [];
        const visited = new Set();

        function visit(win, path) {
          if (!win || visited.has(win)) return;

          visited.add(win);

          let count;

          try {
            count = win.length;
          } catch (error) {
            collected.push({
              win,
              path,
              children: null,
              readable: false
            });
            return;
          }

          collected.push({
            win,
            path,
            children: count,
            readable: true
          });

          for (let i = 0; i < count; i++) {
            try {
              visit(win.frames[i], path.concat(i));
            } catch (error) {
              console.warn(
                "Frame non raggiungibile:",
                path.concat(i),
                error
              );
            }
          }
        }

        try {
          visit(frame.contentWindow, ["siteFrame"]);
        } catch (error) {
          console.warn(
            "Impossibile accedere al frame Hattrick:",
            error
          );
        }

        return collected;
      }

      function createFEvent(win, type) {
        const options = {
          key: "f",
          code: "KeyF",
          keyCode: 70,
          which: 70,
          bubbles: true,
          cancelable: true,
          composed: true
        };

        try {
          return new win.KeyboardEvent(type, options);
        } catch (_) {
          return new KeyboardEvent(type, options);
        }
      }

      function dispatchF(context, type) {
        const win = context.win;

        // Tentativo nel documento del contesto, se accessibile.
        try {
          const doc = win.document;
          const target =
            doc.activeElement &&
            doc.activeElement !== doc.body
              ? doc.activeElement
              : doc;

          const event = createFEvent(win, type);
          target.dispatchEvent(event);

          return {
            percorso: context.path.join(" → "),
            destinazione: target === doc ? "document" : "activeElement",
            esito: "evento sintetico inviato"
          };
        } catch (error) {
          // Nei frame cross-origin il DOM non è accessibile.
          // Tentiamo almeno di inviare l'evento alla Window.
          try {
            win.dispatchEvent(
              createFEvent(window, type)
            );

            return {
              percorso: context.path.join(" → "),
              destinazione: "window",
              esito: "tentativo limitato dal cross-origin"
            };
          } catch (innerError) {
            return {
              percorso: context.path.join(" → "),
              destinazione: "nessuna",
              esito: innerError.message
            };
          }
        }
      }

      async function simulateF(contexts) {
        // Prima keydown: contesti più profondi per primi.
        const results = [];

        for (const context of contexts) {
          results.push(dispatchF(context, "keydown"));
        }

        await sleep(80);

        // Poi keyup nello stesso ordine.
        for (const context of contexts) {
          results.push(dispatchF(context, "keyup"));
        }

        console.log("Risultati tentativo F:");
        console.table(results);

        return results;
      }

      async function focusPlayer() {
        button.disabled = true;
        button.textContent = "RICERCA PLAYER…";
        status.textContent = "Richiesta del focus in corso…";

        try {
          frame.focus({ preventScroll: true });
        } catch (_) {
          frame.focus();
        }

        requestWindowFocus(frame.contentWindow);

        await sleep(300);

        let contexts = collectFrames();

        if (contexts.length <= 1) {
          await sleep(700);
          contexts = collectFrames();
        }

        // Focus: contesti più esterni prima di quelli interni.
        contexts.sort((a, b) => a.path.length - b.path.length);

        let successfulAttempts = 0;

        for (const context of contexts) {
          if (requestWindowFocus(context.win)) {
            successfulAttempts++;
          }

          await sleep(100);
        }

        // Ultimo tentativo sul contesto più profondo.
        if (contexts.length > 0) {
          const deepest = contexts[contexts.length - 1];
          requestWindowFocus(deepest.win);

          console.log(
            "Ultimo contesto focalizzato:",
            deepest.path.join(" → ")
          );
        }

        console.table(
          contexts.map(context => ({
            percorso: context.path.join(" → "),
            profondità: context.path.length,
            sottoframe: context.children,
            contestoLeggibile: context.readable
          }))
        );

        console.log({
          contestiIndividuati: contexts.length,
          tentativiFocusRiusciti: successfulAttempts,
          pagina: location.href,
          elementoAttivo: document.activeElement?.tagName,
          iframeAttivo: document.activeElement === frame
        });

        // Nuova fase: tentativo di pressione sintetica di F.
        status.textContent =
          "Focus richiesto. Tentativo di inviare il tasto F…";

        const deepestFirst = [...contexts].sort(
          (a, b) => b.path.length - a.path.length
        );

        const results = await simulateF(deepestFirst);

        const sent = results.filter(
          item => item.esito === "evento sintetico inviato"
        ).length;

        status.textContent =
          "Procedura terminata. Contesti: " + contexts.length +
          ". Eventi F inviati: " + sent +
          ". Se il fullscreen non parte, il browser richiede una pressione reale.";

        button.textContent = "RIPROVA FOCUS + F";
        button.disabled = false;
      }

      button.addEventListener("click", focusPlayer);

      frame.addEventListener("load", () => {
        status.textContent =
          "Hattrick caricato. Premi FOCUS PLAYER per tentare focus e F.";
      });
    })();
  </script>
</body>
</html>
