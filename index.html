<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>SportsOnlinee — HD8</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #playerFrame {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #fullscreenButton {
      position: absolute;
      z-index: 2147483647;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      min-width: 48px;
      min-height: 48px;
      padding: 10px 15px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 9px;
      background: rgba(12,15,22,.92);
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 15px rgba(0,0,0,.4);
      touch-action: manipulation;
    }

    #fullscreenButton:active {
      background: #245bc7;
    }

    #status {
      position: absolute;
      z-index: 2147483646;
      left: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      max-width: calc(100% - 20px);
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(0,0,0,.75);
      color: #fff;
      font-size: 12px;
      pointer-events: none;
    }

    #status.hidden {
      display: none;
    }

    #stage:fullscreen,
    #stage:-webkit-full-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: 0;
      border-radius: 0;
      background: #000;
    }

    #stage:fullscreen #playerFrame,
    #stage:-webkit-full-screen #playerFrame {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <main id="stage">

    <iframe
      id="playerFrame"
      src="https://w1.sportsonlinee.click/channels/hd/hd8.php"
      title="SportsOnlinee HD8"
      allow="fullscreen *; autoplay *; encrypted-media *; picture-in-picture *"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <button id="fullscreenButton" type="button">
      ⛶ FULLSCREEN
    </button>

    <div id="status">
      Caricamento del player HD8…
    </div>

  </main>

  <script>
    (() => {
      "use strict";

      const stage = document.getElementById("stage");
      const frame = document.getElementById("playerFrame");
      const button = document.getElementById("fullscreenButton");
      const status = document.getElementById("status");

      function isFullscreen() {
        return document.fullscreenElement === stage ||
               document.webkitFullscreenElement === stage;
      }

      async function toggleFullscreen() {
        try {
          if (isFullscreen()) {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
            return;
          }

          if (stage.requestFullscreen) {
            await stage.requestFullscreen();
          } else if (stage.webkitRequestFullscreen) {
            stage.webkitRequestFullscreen();
          } else {
            throw new Error(
              "Fullscreen non supportato da questo browser."
            );
          }
        } catch (error) {
          status.textContent =
            "Fullscreen non riuscito: " +
            (error.name || "Errore") +
            (error.message ? " — " + error.message : "");
        }
      }

      function updateFullscreenState() {
        if (isFullscreen()) {
          button.textContent = "✕ ESCI";
          status.textContent =
            "Fullscreen attivo. Premi ESCI o usa il comando Indietro del browser.";
        } else {
          button.textContent = "⛶ FULLSCREEN";
          status.textContent = "Player nella pagina normale.";
        }
      }

      button.addEventListener("click", toggleFullscreen);

      document.addEventListener(
        "fullscreenchange",
        updateFullscreenState
      );

      document.addEventListener(
        "webkitfullscreenchange",
        updateFullscreenState
      );

      frame.addEventListener("load", () => {
        status.textContent =
          "Pagina HD8 caricata. Premi FULLSCREEN per espandere il player.";
      });
    })();
  </script>
</body>
</html>
