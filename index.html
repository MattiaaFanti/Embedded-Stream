<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Hattrick Sport Player">
  <title>Hattrick Sport — Player Focus</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hattrick Stream">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    #siteFrame {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #playButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 190px;
      min-height: 76px;
      padding: 16px 24px;
      border: 2px solid #fff;
      border-radius: 14px;
      background: rgba(15, 20, 30, .97);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 24px rgba(0, 0, 0, .65);
      touch-action: manipulation;
    }

    #playIcon {
      font-size: 30px;
      line-height: 1;
      color: #fff;
    }

    #playButton:active {
      background: #245bc7;
      transform: translate(-50%, -50%) scale(.97);
    }

    #playButton:disabled {
      opacity: .8;
      cursor: wait;
    }

    #status {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 2147483646;
      width: fit-content;
      max-width: calc(100% - 24px);
      margin: 0 auto;
      padding: 8px 12px;
      border-radius: 7px;
      background: rgba(0, 0, 0, .84);
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
      pointer-events: none;
    }

    #status.hidden {
      display: none;
    }

    #playButton.hidden {
      display: none;
    }

    #stage:fullscreen,
    #stage:-webkit-full-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: 0;
      border-radius: 0;
      background: #000;
    }
  </style>
</head>

<body>
  <main id="stage">

    <iframe
      id="siteFrame"
      src="https://htsport.info/calcio.htm"
      title="Hattrick Sport"

      sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"

      allow="fullscreen *; autoplay *; picture-in-picture *; encrypted-media *"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <button id="playButton" type="button">
      <span id="playIcon" aria-hidden="true">▶</span>
      <span id="playText">AVVIA PLAYER</span>
    </button>

    <div id="status" role="status" aria-live="polite">
      Caricamento di Hattrick Sport…
    </div>

  </main>

  <script>
    (() => {
      "use strict";

      const frame = document.getElementById("siteFrame");
      const button = document.getElementById("playButton");
      const buttonText = document.getElementById("playText");
      const status = document.getElementById("status");

      const sleep = ms =>
        new Promise(resolve => setTimeout(resolve, ms));

      let running = false;

      function requestWindowFocus(win) {
        try {
          win.focus();
          return true;
        } catch (error) {
          return false;
        }
      }

      function collectFrames() {
        const collected = [];
        const visited = new Set();

        function visit(win, path) {
          if (!win || visited.has(win)) {
            return;
          }

          visited.add(win);

          let count = 0;

          try {
            count = win.length;
          } catch (error) {
            collected.push({
              win,
              path,
              children: null,
              readable: false
            });
            return;
          }

          collected.push({
            win,
            path,
            children: count,
            readable: true
          });

          for (let i = 0; i < count; i++) {
            try {
              visit(win.frames[i], path.concat(i));
            } catch (error) {
              console.warn(
                "Frame non raggiungibile:",
                path.concat(i),
                error
              );
            }
          }
        }

        try {
          visit(frame.contentWindow, ["siteFrame"]);
        } catch (error) {
          console.warn(
            "Impossibile accedere al frame Hattrick:",
            error
          );
        }

        return collected;
      }

      function attemptFInContext(context) {
        const win = context.win;
        const result = {
          percorso: context.path.join(" → "),
          inviato: false,
          motivo: ""
        };

        /*
          Tenta di inviare eventi sintetici al documento del contesto.
          L'accesso al documento di un frame cross-origin sarà
          normalmente bloccato dal browser.
        */
        try {
          const doc = win.document;
          const target =
            doc.activeElement &&
            doc.activeElement !== doc.body
              ? doc.activeElement
              : doc;

          const options = {
            key: "f",
            code: "KeyF",
            keyCode: 70,
            which: 70,
            bubbles: true,
            cancelable: true,
            composed: true
          };

          target.dispatchEvent(
            new win.KeyboardEvent("keydown", options)
          );

          setTimeout(() => {
            try {
              target.dispatchEvent(
                new win.KeyboardEvent("keyup", options)
              );
            } catch (_) {}
          }, 50);

          result.inviato = true;
          result.motivo =
            "Evento sintetico inviato al documento accessibile";
        } catch (error) {
          result.motivo =
            "DOM non accessibile: " + error.name;
        }

        return result;
      }

      async function focusPlayer() {
        if (running) return;

        running = true;
        button.disabled = true;
        buttonText.textContent = "RICERCA PLAYER…";
        status.classList.remove("hidden");
        status.textContent = "Richiesta del focus in corso…";

        /*
          Primo tentativo: focus diretto sull'iframe Hattrick.
        */
        try {
          frame.focus({ preventScroll: true });
        } catch (_) {
          frame.focus();
        }

        requestWindowFocus(frame.contentWindow);

        await sleep(300);

        let contexts = collectFrames();

        /*
          Se non sono stati enumerati frame discendenti,
          attende il caricamento iniziale e riprova.
        */
        if (contexts.length <= 1) {
          await sleep(700);
          contexts = collectFrames();
        }

        contexts.sort(
          (a, b) => a.path.length - b.path.length
        );

        let focusAttempts = 0;

        for (const context of contexts) {
          if (requestWindowFocus(context.win)) {
            focusAttempts++;
          }

          await sleep(100);
        }

        /*
          Ultimo tentativo di focus sul contesto più profondo
          raggiungibile dalla finestra esterna.
        */
        if (contexts.length > 0) {
          const deepest = contexts[contexts.length - 1];

          requestWindowFocus(deepest.win);

          console.log(
            "Ultimo contesto raggiunto:",
            deepest.path.join(" → ")
          );
        }

        console.table(
          contexts.map(context => ({
            percorso: context.path.join(" → "),
            profondità: context.path.length,
            sottoframe: context.children,
            contestoLeggibile: context.readable
          }))
        );

        /*
          Tentativo finale di F, partendo dai frame più profondi.
          Questo non equivale a una pressione fisica del tasto.
        */
        const deepestFirst = [...contexts].sort(
          (a, b) => b.path.length - a.path.length
        );

        const results = [];

        for (const context of deepestFirst) {
          results.push(attemptFInContext(context));
        }

        console.table(results);

        /*
          Rimuove il pulsante per lasciare visibile l'intero player.
          L'overlay non intercetta più interazioni successive.
        */
        button.classList.add("hidden");

        status.textContent =
          "Focus richiesto. Contesti: " + contexts.length +
          ". Tentativi focus: " + focusAttempts +
          ". Tentativi F completati: " +
          results.filter(result => result.inviato).length +
          ". Se il player non entra in fullscreen, premi F fisicamente.";

        console.log({
          pagina: location.href,
          contestiIndividuati: contexts.length,
          tentativiFocusRiusciti: focusAttempts,
          risultatiF: results
        });

        running = false;
        button.disabled = false;
      }

      button.addEventListener("click", focusPlayer);

      frame.addEventListener("load", () => {
        status.textContent =
          "Hattrick caricato. Premi AVVIA PLAYER per tentare focus e fullscreen.";
      });

      /*
        Registra il service worker esistente per la PWA, se presente.
      */
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js", { scope: "./" })
            .catch(error => {
              console.warn("Service worker non registrato:", error);
            });
        });
      }
    })();
  </script>
</body>
</html>
